crawler:
  feed_urls_file: data/input/feed_urls.txt
  collected_articles_file: data/output/temp_collected_articles.jsonl
  extracted_articles_file: data/output/extracted_articles.jsonl
  stats_file: data/output/crawler_stats.jsonl
  state_file: data/_state/extraction_state.jsonl
  max_articles_per_feed: 700
  collection_window_days: 7
  extraction_retention_days: 365

preprocessor:
  input_articles_file: data/output/extracted_articles.jsonl
  processed_articles_file: data/output/processed_articles.jsonl
  text_processing:
    lowercase: true
    lemmatize: true
    remove_stopwords: true
    remove_punctuation: true
    alphabetic_only: false

lexical_indexer:
  input_articles_file: data/output/processed_articles.jsonl
  index_dir: data/output/index
  search:
    max_results: 10

llm:
  models: 
    - qwen3:8b
    - gemma4:12b
    
  models_retry_delay_seconds: 5
  max_retries: 2
  timeout: 60
  api_base: http://156.35.160.78:4000
  temperature: 0.1
  prompts:
    interest_summary: src/services/llm/prompts/prompt_interest_summarizer.txt
    query_generation: src/services/llm/prompts/prompt_query_generator.txt
    relevance_evaluation: src/services/llm/prompts/prompt_relevance_evaluator.txt

article_processor:
  selection_margin: 3

newsletter:
  relevance_threshold: 5.0