name: Daily application pipeline

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python -m spacy download es_core_news_sm
          python -m spacy download en_core_web_sm

      - name: Run crawler
        run: |
          python -m src.runners.run_crawler

      - name: Run preprocessor
        run: |
          python -m src.runners.run_preprocessor
      
      - name: Run lexical indexer
        run: |
          python -m src.runners.run_lexical_indexer

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Crawler news data update"
            git push
          fi